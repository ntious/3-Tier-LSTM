# Configuration for Hybrid 3-Tier LSTM (Breast Cancer) pipeline
paths:
  data_file: "data/Cancer_Data.xls"
  outputs_dir: "outputs"
  model_dir: "outputs/models"
  reports_dir: "outputs/reports"
  figures_dir: "outputs/figures"

seed: 42

data:
  drop_columns: ["id", "Unnamed: 32"]
  target_column: "diagnosis"
  positive_label: "M"   # Malignant
  negative_label: "B"   # Benign

split:
  test_size: 0.2
  stratify: true

smote:
  apply: true
  k_neighbors: 5

dt_feature_selection:
  use: true
  max_depth: 5
  random_state: 42
  top_k: 30   # keep up to 30 features (dataset has 30 standard features)

scaling:
  method: "standard"  # standard | minmax

lstm:
  tier1_dense_units: 64
  lstm_units: 64
  tier3_dense_units: 32
  dropout: 0.2
  l2: 0.0001

training:
  batch_size: 32
  epochs: 30
  validation_split: 0.2
  early_stopping_patience: 5

explainability:
  shap:
    sample_size_background: 100
    sample_size_explain: 50
  lime:
    num_features: 10
    num_samples: 5000
